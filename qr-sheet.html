<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Sheet — Store Launch</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F2F7; --card:#fff; --label:#000; --label-2:rgba(60,60,67,.6);
    --separator:rgba(60,60,67,.18); --accent:#007AFF; --accent-2:#5E5CE6;
    --font:-apple-system, BlinkMacSystemFont, 'SF Pro Display','SF Pro Text','Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:var(--font); background:var(--bg); color:var(--label);
    -webkit-font-smoothing:antialiased; letter-spacing:-.012em;}
  .controls{max-width:720px; margin:0 auto; padding:40px 24px 8px;}
  .controls h1{font-size:34px; font-weight:700; letter-spacing:-.03em; margin:0 0 8px;}
  .controls p{font-size:15px; line-height:1.45; color:var(--label-2); margin:0 0 20px;}
  .panel{background:var(--card); border-radius:20px; padding:8px 16px; box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 34px rgba(0,0,0,.05);}
  .field{display:flex; align-items:center; gap:12px; padding:14px 2px;}
  .field + .field{border-top:.5px solid var(--separator);}
  .field label{font-size:15px; font-weight:590; width:78px; flex:none;}
  .field input{flex:1; border:none; outline:none; font:inherit; font-size:15px; color:var(--label); background:transparent; min-width:0;}
  .actions{display:flex; gap:10px; margin:20px 0 0;}
  .btn{flex:1; border:none; cursor:pointer; border-radius:14px; padding:15px; font:inherit; font-size:17px; font-weight:600; letter-spacing:-.02em;
    transition:transform .25s cubic-bezier(.32,.72,0,1);}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-sec{background:rgba(120,120,128,.12); color:var(--accent);}
  .hint{font-size:13px; color:var(--label-2); margin-top:14px; text-align:center;}

  .cards{display:flex; flex-direction:column; align-items:center; gap:22px; padding:34px 24px 70px;}
  .card{width:620px; max-width:100%; background:var(--card); border-radius:32px; padding:56px 44px 46px; text-align:center;
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 14px 44px rgba(0,0,0,.07); page-break-after:always; break-after:page;}
  .card .brand{font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--label-2);}
  .card .model{font-size:60px; font-weight:700; letter-spacing:-.035em; line-height:1; margin:12px 0 6px;}
  .card .of{font-size:17px; font-weight:500; color:var(--label-2);}
  .qrbox{margin:32px auto 0; width:320px; max-width:100%; background:#fff; border-radius:26px; padding:20px;
    border:.5px solid var(--separator); display:flex; align-items:center; justify-content:center;}
  .qrbox img,.qrbox canvas{display:block; width:280px !important; height:280px !important;}
  .cta{font-size:26px; font-weight:700; letter-spacing:-.026em; margin:30px 0 0;}
  .sub{font-size:16px; color:var(--label-2); margin:8px 0 0;}
  .pillrow{display:flex; justify-content:center; gap:8px; margin-top:22px; flex-wrap:wrap;}
  .pill{background:rgba(120,120,128,.12); border-radius:999px; padding:9px 16px; font-size:14px; font-weight:590;}
  .pill.accent{background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff;}
  .url{font-size:11px; color:rgba(60,60,67,.35); margin-top:24px; word-break:break-all;}

  @media print{
    @page{ margin:14mm; }
    body{background:#fff;}
    .controls{display:none;}
    .cards{padding:0; gap:0;}
    .card{width:100%; max-width:none; box-shadow:none; border-radius:0; padding:0;
      height:calc(100vh - 28mm); display:flex; flex-direction:column; align-items:center; justify-content:center;}
    .card:last-child{page-break-after:auto;}
  }
</style>
</head>
<body>
<div class="controls">
  <h1>Coduri QR — cele 10 modele</h1>
  <p>Pune adresa la care e publicată aplicația, apasă Generează, apoi Printează. Fiecare model iese pe pagina lui A4. Codurile trebuie să fie identice cu cele din <code>index.html</code>.</p>
  <div class="panel">
    <div class="field"><label for="brand">Magazin</label><input id="brand" value="STORE NAME"></div>
    <div class="field"><label for="baseUrl">Adresă</label><input id="baseUrl" placeholder="https://exemplu.netlify.app/"></div>
  </div>
  <div class="actions">
    <button class="btn btn-sec" onclick="gen()">Generează</button>
    <button class="btn btn-primary" onclick="window.print()">Printează</button>
  </div>
  <p class="hint">Sfat: printează pe hârtie mată — QR-ul se citește mai bine fără reflexii.</p>
</div>
<div class="cards" id="cards"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const MODEL_CODES = [
  'LX1-K7QP','LX2-M3ZR','LX3-T9VD','LX4-B6HN','LX5-W2SJ',
  'LX6-F8CY','LX7-D4XA','LX8-P5EU','LX9-G1LT','LX10-N0RB'
];

document.getElementById('baseUrl').value = location.origin + location.pathname.replace(/qr-sheet\.html$/,'');

function gen(){
  let base = document.getElementById('baseUrl').value.trim();
  const brand = document.getElementById('brand').value.trim() || 'STORE';
  if(!base){ alert('Pune adresa aplicației'); return; }
  if(!/\/$/.test(base) && !/\.html$/.test(base)) base += '/';
  const wrap = document.getElementById('cards');
  wrap.innerHTML = '';
  MODEL_CODES.forEach((code,i)=>{
    const url = base + '#/c/' + code;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="brand">${brand}</div>
      <div class="model">Model ${String(i+1).padStart(2,'0')}</div>
      <div class="of">din 10</div>
      <div class="qrbox"><div id="qr${i}"></div></div>
      <div class="cta">Scanează și primești 1 punct</div>
      <div class="sub">Deschide camera telefonului și încadrează codul</div>
      <div class="pillrow">
        <span class="pill">10 modele în mall</span>
        <span class="pill accent">10 puncte = premiu la casă</span>
      </div>
      <div class="url">${url}</div>`;
    wrap.appendChild(card);
    new QRCode(document.getElementById('qr'+i), {text:url, width:280, height:280, correctLevel:QRCode.CorrectLevel.M});
  });
}
gen();
</script>
</body>
</html>
